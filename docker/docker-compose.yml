      MYSQL_HOST: mysql
      MYSQL_USER: chat_user
      MYSQL_PASS: chat_pass
      MYSQL_DB: chat
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SQLITE_HOST: sqlite-service
      SQLITE_PORT: "7777"
